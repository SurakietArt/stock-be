name: stock

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  static_volume:

services:
  db:
    image: postgres:14
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DATABASE_NAME}"
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
    ports:
        - "${DATABASE_PORT}:5432"
    healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 5s
        timeout: 5s
        retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

  web:
    restart: on-failure # will restart until it's success
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8080"
    depends_on:
      - db
    networks:
      - backend
